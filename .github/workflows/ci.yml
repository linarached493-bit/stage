name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: black --check .
      - run: ruff check .
      - run: pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci` est volontairement évité : aucun package-lock.json n'a pu
      # être généré dans l'environnement de développement (Node.js n'y a
      # jamais été disponible, voir README.md). À remplacer par `npm ci`
      # dès qu'un lockfile réel aura été produit et commité depuis une
      # machine disposant de Node.js.
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
